name: Build and Package App (Legacy - Do not use)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Mobile App
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Note about EAS
        run: |
          echo "⚠️  This workflow requires EAS_TOKEN secret to be set"
          echo "For native builds, use EAS Build instead:"
          echo "  eas build --platform android"
          echo "  eas build --platform ios"
          echo ""
          echo "Primary workflow: build-apk.yml (recommended)"
          echo "  - No authentication needed"
          echo "  - Builds web version automatically"
          echo "  - Supports GitHub Pages deployment"
